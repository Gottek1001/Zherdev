version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: devops-app
    ports:
      - "5000:5000"
    environment:
      - STUDENT_NAME=${STUDENT_NAME:-Федоськина Виктория Эдуардовна}
      - STUDENT_GROUP=${STUDENT_GROUP:-БИСТ-22-ИТ-2}
    env_file:
      - .env
    volumes:
      - ./app:/app
    restart: unless-stopped
    networks:
      - devops-network

  nginx:
    image: nginx:alpine
    container_name: devops-nginx
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - web
    restart: unless-stopped
    networks:
      - devops-network

networks:
  devops-network:
    driver: bridge